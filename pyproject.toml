[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "copilot-trust-analytics"
version = "0.5.0"
description = "Privacy-safe AI developer-tool abuse analytics and investigation workbench"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0","numpy>=1.24","scikit-learn>=1.3","plotly>=5.18","PyYAML>=6.0","tabulate>=0.9"]

[tool.setuptools.packages.find]
where = ["src"]
