name: trust-analytics-ci
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test-and-benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Unit and integration tests
        run: pytest -q
      - name: Rebuild reproducible decision benchmark
        run: python run_all.py --n-accounts 120 --seed 17
      - name: Verify decision artifacts
        run: |
          test -s artifacts/model_metrics.json
          test -s artifacts/emerging_trend_alerts.csv
          test -s artifacts/data_quality_findings.csv
          test -s artifacts/rule_shadow_evaluation.csv
          test -s artifacts/review_feedback_metrics.csv
          test -s artifacts/mitigation_evaluation.csv
          test -s artifacts/stakeholder_action_register.csv
          test -s artifacts/feature_drift_diagnostics.csv
          test -s artifacts/risk_calibration_bins.csv
          test -s artifacts/queue_sla_snapshot.csv
          test -s artifacts/queue_capacity_plan.csv
          test -s artifacts/detection_rule_registry.csv
          test -s artifacts/policy_threshold_frontier.csv
          test -s artifacts/policy_threshold_recommendation.json
          test -s artifacts/historical_rule_replay.csv
          test -s artifacts/historical_case_arrivals.csv
          test -s artifacts/historical_rule_replay_summary.csv
          test -s artifacts/rule_evidence_power.csv
          test -s artifacts/queue_simulation_daily.csv
          test -s artifacts/queue_simulation_summary.csv
          test -s artifacts/entitlement_cycle_usage.csv
          test -s artifacts/billing_family_risk.csv
          test -s artifacts/entitlement_investigation_queue.csv
          test -s artifacts/entitlement_data_quality.csv
          test -s artifacts/emerging_novelty_accounts.csv
          test -s artifacts/emerging_behavior_cohorts.csv
          test -s artifacts/emerging_graph_triage.csv
          test -s artifacts/candidate_taxonomy_proposals.csv
          test -s artifacts/novel_shadow_rule_candidates.csv
          test -s artifacts/novelty_incident_diagnostics.csv
          test -s artifacts/emerging_discovery_benchmark.json
          test -s artifacts/adversarial_rule_stress.csv
          test -s artifacts/defense_in_depth_stress.csv
          test -s artifacts/adversarial_stress_summary.json
          test -s artifacts/evasion_regression_gates.csv
          test -s artifacts/policy_experiment_assignment.csv
          test -s artifacts/policy_experiment_daily_outcomes.csv
          test -s artifacts/policy_experiment_effect_summary.csv
          test -s artifacts/policy_experiment_pretrend.csv
          test -s artifacts/policy_experiment_heterogeneous_effects.csv
          test -s artifacts/policy_experiment_sequential_monitor.csv
          test -s artifacts/policy_experiment_interference_audit.csv
          test -s artifacts/policy_experiment_review_guardrails.csv
          test -s artifacts/policy_experiment_stopping_decision.json
          test -s artifacts/policy_experiment_benchmark.json
          test -s artifacts/operating_control_registry.csv
          test -s artifacts/decision_lineage.csv
          test -s artifacts/data_lineage.csv
          test -s artifacts/operating_slo_scorecard.csv
          test -s artifacts/incident_replay_register.csv
          test -s artifacts/decision_audit_trail.csv
          test -s artifacts/evidence_package_index.csv
          test -s artifacts/release_readiness.json
          test -s artifacts/evidence_packages/PKG-001.md
          test -s data/entitlements.csv
          test -s data/hidden_novelty_manifest.csv
          test -s data/hidden_policy_experiment_manifest.csv
          test -s docs/START_HERE.md
          test -s docs/index.html
          grep -q "v1.0 Operating brief" docs/index.html
          grep -q '"automatic_enforcement_allowed": false' artifacts/release_readiness.json
      - uses: actions/upload-artifact@v4
        with:
          name: trust-safety-decision-benchmark
          path: |
            artifacts/model_metrics.json
